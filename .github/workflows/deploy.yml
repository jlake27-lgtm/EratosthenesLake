# Builds the site and publishes it to GitHub Pages on every push to main or add-showcase-page.
# The simulator is always built from main; showcase.html is copied in from add-showcase-page
# and served at /showcase.html. Keep this file identical on both branches.
# Repo settings required: Settings → Pages → Source: "GitHub Actions", and both branches
# allowed under Settings → Environments → github-pages → Deployment branches.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, add-showcase-page]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel one that's already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Add showcase page from add-showcase-page
        run: |
          if git fetch --depth=1 origin add-showcase-page; then
            git show FETCH_HEAD:showcase.html > dist/showcase.html
          else
            echo "add-showcase-page not found; deploying without the showcase"
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
